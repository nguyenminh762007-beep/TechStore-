
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Online</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#222;color:white;padding:20px;text-align:center}
nav{background:#444;padding:12px;text-align:center}
nav a{color:white;margin:15px;text-decoration:none}
.container{padding:25px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.product{background:white;width:220px;padding:15px;text-align:center;border-radius:10px;box-shadow:0 2px 8px #ccc}
.product img{width:100%;height:150px;object-fit:cover}
button{background:#ff5722;color:white;border:0;padding:10px 15px;border-radius:5px;cursor:pointer}
button:hover{background:#e64a19}
footer{background:#222;color:white;text-align:center;padding:15px}
</style>
</head>
<body>

<header>
<h1>SHOP ONLINE</h1>
<p>Chào mừng bạn đến với cửa hàng!</p>
</header>

<nav>
<a href="#">Trang chủ</a>
<a href="#products">Sản phẩm</a>
<a href="#contact">Liên hệ</a>
</nav>

<h2 style="text-align:center">SẢN PHẨM NỔI BẬT</h2>

<div class="container" id="products" aria-live="polite">
    Đang tải sản phẩm từ database...
</div>

<h3 style="text-align:center" id="cart">Giỏ hàng: 0 sản phẩm</h3>

<footer id="contact">
<p>Liên hệ: shoponline@gmail.com</p>
<p>© 2026 Shop Online</p>
</footer>

<script>
let cart = 0;
const productsContainer = document.getElementById("products");
const productImages = {
    "Áo thun": "https://picsum.photos/300/200?1",
    "Giày thể thao": "https://picsum.photos/300/200?2",
    "Balo": "https://picsum.photos/300/200?3"
};

function renderProducts(products){
    productsContainer.replaceChildren();

    if (products.length === 0) {
        productsContainer.textContent = "Chưa có sản phẩm trong database.";
        return;
    }

    for (const product of products) {
        const card = document.createElement("div");
        card.className = "product";

        const image = document.createElement("img");
        image.src = productImages[product.name] ||
            "https://picsum.photos/300/200";
        image.alt = product.name;

        const name = document.createElement("h3");
        name.textContent = product.name;

        const price = document.createElement("p");
        price.textContent =
            Number(product.price).toLocaleString("vi-VN") + "đ";

        const button = document.createElement("button");
        button.textContent = "Mua ngay";
        button.addEventListener("click", () => addCart(product.name));

        card.append(image, name, price, button);
        productsContainer.append(card);
    }
}

async function loadProducts(){
    try {
        const response = await fetch("/api/products");
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.message || "Không thể tải sản phẩm.");
        }

        renderProducts(result.data);
    } catch (error) {
        console.error("Lỗi tải sản phẩm:", error);
        productsContainer.textContent =
            "Không thể tải sản phẩm từ SQL Server. Hãy kiểm tra backend.";
    }
}

function addCart(name){
cart++;
document.getElementById("cart").innerText =
"Giỏ hàng: " + cart + " sản phẩm";
alert("Đã thêm " + name + " vào giỏ hàng!");
}

loadProducts();
</script>

</body>
</html>
